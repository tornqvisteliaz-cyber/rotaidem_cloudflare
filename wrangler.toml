name = "rotaidem"
main = "src/index.js"
compatibility_date = "2026-04-02"
compatibility_flags = ["nodejs_compat"]

# Existing Jinja templates and static files. The worker handles every request
# first so HTML is rendered with the current session, not served as raw files.
[assets]
directory = "./website"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "rotaidem"
database_id = "30d54080-2596-48f8-9353-4cb2715fc9a8"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rotaidem-uploads"

[vars]
APP_ENV = "production"

# Custom domain. The zone for rotaidem.com must be on this Cloudflare account.
[[routes]]
pattern = "rotaidem.com"
custom_domain = true

[[routes]]
pattern = "www.rotaidem.com"
custom_domain = true
